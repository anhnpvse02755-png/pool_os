name: Architecture Fitness

on:
  pull_request:
  push:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    name: Domain boundaries and architecture health
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Flutter and Dart
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Run architecture fitness tests
        run: dart run tool/architecture_test.dart

      - name: Upload architecture health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: architecture-health-${{ github.run_id }}
          path: build/architecture/health.json
          if-no-files-found: warn
          retention-days: 30
