name: billiard_knowledge
description: >
  A comprehensive billiard and pool knowledge library for Flutter applications.
  Provides structured access to techniques, mistakes, strategies, equipment,
  and learning paths with offline support, search, and recommendations.
version: 1.0.0
publish_to: none
repository: https://github.com/pool-os/billiard-knowledge

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Functional programming utilities
  collection: ^1.18.0
  
  # Caching
  shared_preferences: ^2.2.2
  
  # JSON serialization
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  mockito: ^5.4.4

flutter:
  assets:
    - assets/knowledge/
    - assets/knowledge/techniques/
    - assets/knowledge/mistakes/
    - assets/knowledge/strategies/
    - assets/knowledge/equipment/
    - assets/knowledge/mental/
    - assets/knowledge/aim/
    - assets/knowledge/bridge/
    - assets/knowledge/cue_ball/
    - assets/knowledge/bank/
    - assets/knowledge/drills/
    - assets/knowledge/learning_paths/

  fonts:
    - family: PoolKnowledge
      fonts:
        - asset: assets/fonts/pool_icons.ttf
