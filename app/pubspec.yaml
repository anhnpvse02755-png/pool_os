name: pool_os
description: "AI-assisted pool training operating system."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.2
  go_router: ^13.0.0
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  lucide_icons: ^0.17.0
  fl_chart: ^0.66.2
  flutter_animate: ^4.5.0
  intl: ^0.20.2
  uuid: ^4.4.0
  cupertino_icons: ^1.0.8
  billiard_knowledge:
    path: ../packages/billiard_knowledge
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  drift_dev: ^2.14.1
  riverpod_generator: ^2.3.9
  riverpod_lint: ^2.3.7
  custom_lint: ^0.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/knowledge/
    - assets/knowledge/techniques/
    - assets/knowledge/mistakes/
    - assets/knowledge/equipment/
    - assets/knowledge/mental/
    - assets/knowledge/strategy/
